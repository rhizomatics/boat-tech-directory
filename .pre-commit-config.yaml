repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,Technik
          - --skip="./.*,*.csv,*.json"
          - --quiet-level=2
        exclude_types: [csv, json]
  - repo: https://github.com/pengqun/pre-commit-hooks
    rev: v1.1.0
    hooks:
      - id: awesome-lint
        files: ^README\.md$
  - repo: https://github.com/lycheeverse/lychee.git
    rev: nightly
    hooks:
      - id: lychee
        # Optionally include additional CLI arguments
        args: ["--no-progress", "--max-cache-age","7d","--exclude", "file://LICENSE"]
        stages: [manual]
  - repo: local
    hooks:
      # Converts the maintainer's Apple Numbers originals into site/spreadsheets/*.xlsx and
      # stages them. Sources only exist on the maintainer's Mac; elsewhere this is a no-op.
      - id: sync-spreadsheets
        name: Sync spreadsheets from Numbers
        entry: python site/scripts/sync_spreadsheets.py --stage
        language: python
        additional_dependencies: ["numbers-parser>=4.19", "openpyxl>=3.1"]
        always_run: true
        pass_filenames: false
